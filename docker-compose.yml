services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: life-companion-app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=gemini-2.5-flash
    volumes:
      - ./data:/app/data
    restart: unless-stopped
